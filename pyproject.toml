[project]
name = "overwatch-aio-skill"
version = "0.3.0"
description = "On-demand Overwatch skill and optional MCP server with provenance and evidence management"
keywords = ["overwatch", "mcp", "mcp-server", "model-context-protocol", "agent-skills", "codex"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx2>=2.12,<3", "pydantic>=2.12,<3", "beautifulsoup4>=4.13,<5"]

[project.optional-dependencies]
mcp = ["mcp>=2.1,<3"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "jsonschema>=4.23,<5", "pyyaml>=6,<7"]

[project.scripts]
overwatch-aio-skill = "overwatch_skill.cli:main"
overwatch-aio-mcp = "overwatch_skill.mcp_cli:main"

[project.urls]
Repository = "https://github.com/BK927/overwatch-aio"
Documentation = "https://github.com/BK927/overwatch-aio#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overwatch_skill"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
