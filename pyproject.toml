[project]
name = "overwatch-aio-skill"
version = "0.3.2"
description = "Overwatch 2 data MCP server and agent skill for hero meta, player stats, replays, patch notes, and OWCS Korea with provenance."
keywords = [
  "overwatch",
  "overwatch-2",
  "ow2",
  "hero-statistics",
  "player-stats",
  "replay-codes",
  "patch-notes",
  "owcs",
  "esports",
  "game-data",
  "mcp",
  "mcp-server",
  "model-context-protocol",
  "agent-skills",
  "codex",
  "sqlite",
]
readme = "README.md"
authors = [{ name = "BK927" }]
requires-python = ">=3.11"
dependencies = ["httpx2>=2.12,<3", "pydantic>=2.12,<3", "beautifulsoup4>=4.13,<5"]

[project.optional-dependencies]
mcp = ["mcp>=2.1,<3"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "jsonschema>=4.23,<5", "pyyaml>=6,<7"]

[project.scripts]
overwatch-aio-skill = "overwatch_skill.cli:main"
overwatch-aio-mcp = "overwatch_skill.mcp_cli:main"

[project.urls]
Homepage = "https://github.com/BK927/overwatch-aio"
Repository = "https://github.com/BK927/overwatch-aio"
Documentation = "https://github.com/BK927/overwatch-aio#readme"
Issues = "https://github.com/BK927/overwatch-aio/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overwatch_skill"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
