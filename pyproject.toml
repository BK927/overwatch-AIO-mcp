[project]
name = "overwatch-aio-mcp"
version = "0.1.0"
description = "Evidence-aware, read-only Overwatch MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.1,<3", "httpx2>=2.12,<3", "pydantic>=2.12,<3", "beautifulsoup4>=4.13,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
overwatch-aio-mcp = "overwatch_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overwatch_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
