name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run --frozen --extra dev ruff check src tests scripts
      - run: uv run --frozen --extra dev ruff format --check src tests scripts
      - run: uv run --frozen --extra dev python scripts/validate_skill.py
      - run: uv run --frozen --extra dev pytest -q
      - run: uv build
